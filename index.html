<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>청주 쓰레기 수거일 안내</title>

  <!-- OpenLayers: NGII 배경지도를 직접 WMTS로 호출 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@6.4.3/ol.css" type="text/css" />

  <style>
    :root {
      --bg: #f7f7f4;
      --panel: #ffffff;
      --ink: #171816;
      --muted: #72766f;
      --line: #e7e8e3;
      --accent: #1f6f4a;
      --accent-soft: #eaf4ee;
      --recycle: #23679a;
      --recycle-soft: #eaf2f8;
      --danger: #b42318;
      --shadow: 0 18px 55px rgba(23, 24, 22, .09);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    /* ---------- 첫 화면 ---------- */
    #searchScreen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .search-stage {
      width: min(720px, 100%);
      transform: translateY(-4vh);
    }

    .wordmark {
      font-weight: 800;
      letter-spacing: -0.05em;
      font-size: clamp(24px, 3.4vw, 38px);
      margin: 0 0 24px;
      text-align: center;
    }

    .wordmark span { color: var(--accent); }

    .hero-search {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .hero-search input {
      width: 100%;
      height: 58px;
      border: 0;
      outline: none;
      padding: 0 16px;
      background: transparent;
      color: var(--ink);
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .hero-search input::placeholder { color: #a3a69f; }

    .hero-search button {
      height: 58px;
      border: 0;
      border-radius: 15px;
      padding: 0 24px;
      background: var(--ink);
      color: #fff;
      font-weight: 750;
    }

    .search-message {
      min-height: 24px;
      margin-top: 13px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .search-message.error { color: var(--danger); }

    /* ---------- 결과 화면 ---------- */
    #resultScreen {
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
    }

    .result-layout {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(350px, 40%) 1fr;
    }

    .info-panel {
      position: relative;
      z-index: 3;
      padding: 28px clamp(24px, 4vw, 58px) 34px;
      background: #fff;
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

    .info-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 54px;
    }

    .mini-brand { font-weight: 820; letter-spacing: -0.04em; }
    .mini-brand span { color: var(--accent); }

    .back-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      height: 40px;
      padding: 0 15px;
      font-weight: 700;
      font-size: 13px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .04em;
      margin-bottom: 10px;
    }

    .address-title {
      margin: 0;
      font-size: clamp(27px, 3vw, 42px);
      line-height: 1.2;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    .address-sub {
      margin: 13px 0 34px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .schedule-list { display: grid; gap: 14px; }

    .schedule-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      background: #fff;
    }

    .schedule-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .schedule-name {
      font-size: 18px;
      font-weight: 820;
      letter-spacing: -0.035em;
    }

    .schedule-desc { color: var(--muted); font-size: 12px; margin-top: 5px; }

    .badge {
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .general .badge { color: var(--accent); background: var(--accent-soft); }
    .recycle .badge { color: var(--recycle); background: var(--recycle-soft); }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      min-height: 34px;
      border-radius: 10px;
      background: #f5f5f2;
      color: #555a53;
      font-size: 12px;
      font-weight: 750;
    }

    .day.today {
      color: #fff;
      background: var(--ink);
      outline: 3px solid rgba(23,24,22,.08);
    }

    .today-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      color: #3c413b;
      font-size: 13px;
      font-weight: 650;
    }

    .today-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .disclaimer {
      margin-top: 22px;
      color: #8b8e88;
      font-size: 11px;
      line-height: 1.6;
    }

    .map-panel {
      position: relative;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #eef0eb;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .map-toolbar {
      position: absolute;
      z-index: 20;
      top: 18px;
      right: 18px;
      padding: 5px;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px);
      border-radius: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      display: flex;
      gap: 4px;
    }

    .map-toolbar button {
      border: 0;
      background: transparent;
      border-radius: 9px;
      height: 38px;
      padding: 0 13px;
      font-size: 12px;
      font-weight: 780;
      color: #555a53;
    }

    .map-toolbar button.active {
      background: var(--ink);
      color: #fff;
    }

    .map-status {
      position: absolute;
      z-index: 20;
      left: 18px;
      bottom: 18px;
      max-width: calc(100% - 36px);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 7px 22px rgba(0,0,0,.10);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 11px;
      color: #5e625c;
      backdrop-filter: blur(8px);
    }

    .pin {
      width: 23px;
      height: 23px;
      border-radius: 50% 50% 50% 0;
      background: #171816;
      transform: rotate(-45deg);
      border: 3px solid #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,.28);
    }
    .pin::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      top: 5px;
      left: 5px;
    }

    @media (max-width: 820px) {
      .search-stage { transform: translateY(-2vh); }
      .result-layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 54vh); }
      .info-panel { border-right: 0; border-bottom: 1px solid var(--line); padding: 22px 20px 28px; overflow: visible; }
      .info-top { margin-bottom: 34px; }
      .address-title { font-size: 30px; }
      .map-panel { min-height: 440px; }
      .days { gap: 5px; }
    }

    @media (max-width: 520px) {
      #searchScreen { padding: 18px; }
      .wordmark { margin-bottom: 18px; }
      .hero-search { grid-template-columns: 1fr; padding: 8px; border-radius: 18px; }
      .hero-search input { height: 54px; padding: 0 13px; font-size: 16px; }
      .hero-search button { height: 52px; width: 100%; border-radius: 12px; }
      .schedule-card { padding: 18px; border-radius: 17px; }
      .day { font-size: 11px; border-radius: 8px; }
      .map-toolbar { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <!-- 1. 첫 화면: 주소 검색만 -->
  <section id="searchScreen" aria-label="주소 검색">
    <div class="search-stage">
      <h1 class="wordmark">청주<span>수거</span></h1>
      <form id="firstSearchForm" class="hero-search">
        <input id="firstAddressInput" type="text" autocomplete="street-address" placeholder="주소를 입력하세요" aria-label="주소 입력" />
        <button type="submit">확인</button>
      </form>
      <div id="searchMessage" class="search-message"></div>
    </div>
  </section>

  <!-- 2. 검색 후 결과 화면 -->
  <section id="resultScreen" class="hidden" aria-label="쓰레기 수거일 결과">
    <div class="result-layout">
      <aside class="info-panel">
        <div class="info-top">
          <div class="mini-brand">청주<span>수거</span></div>
          <button id="backBtn" class="back-btn" type="button">주소 다시 검색</button>
        </div>

        <span class="eyebrow">검색한 주소</span>
        <h2 id="selectedAddress" class="address-title">-</h2>
        <p id="addressSub" class="address-sub">해당 위치의 수거일정입니다.</p>

        <div class="schedule-list">
          <article class="schedule-card general">
            <div class="schedule-head">
              <div>
                <div class="schedule-name">일반쓰레기</div>
                <div class="schedule-desc">종량제 봉투 등</div>
              </div>
              <span class="badge">매일 수거</span>
            </div>
            <div class="days js-days" aria-label="일반쓰레기 수거요일"></div>
            <div class="today-note"><span class="today-dot"></span>오늘도 수거하는 날입니다.</div>
          </article>

          <article class="schedule-card recycle">
            <div class="schedule-head">
              <div>
                <div class="schedule-name">재활용품</div>
                <div class="schedule-desc">종이·플라스틱·캔·병 등</div>
              </div>
              <span class="badge">매일 수거</span>
            </div>
            <div class="days js-days" aria-label="재활용품 수거요일"></div>
            <div class="today-note"><span class="today-dot"></span>오늘도 수거하는 날입니다.</div>
          </article>
        </div>

        <div class="disclaimer">※ 현재는 시범 버전으로 모든 요일을 수거일로 표시합니다. 실제 지역별 수거일정 데이터는 추후 연결할 수 있습니다.</div>
      </aside>

      <main class="map-panel">
        <div id="map" aria-label="국토지리정보원 지도"></div>
        <div class="map-toolbar" role="group" aria-label="지도 종류 선택">
          <button id="normalMapBtn" class="active" type="button" aria-pressed="true">일반지도</button>
          <button id="airMapBtn" type="button" aria-pressed="false">영상지도</button>
        </div>
        <div id="mapStatus" class="map-status">국토지리정보원 지도 불러오는 중…</div>
      </main>
    </div>
  </section>

  <script>
    // 사용자 제공 키
    const NGII_API_KEY = 'BC50051AEF015E3F753AB1663736403907ED98D5DE';
    const KAKAO_JAVASCRIPT_KEY = 'a103b2ec4ae35a508696bd61dabc0d65';

    const searchScreen = document.getElementById('searchScreen');
    const resultScreen = document.getElementById('resultScreen');
    const firstSearchForm = document.getElementById('firstSearchForm');
    const firstAddressInput = document.getElementById('firstAddressInput');
    const searchMessage = document.getElementById('searchMessage');
    const selectedAddress = document.getElementById('selectedAddress');
    const addressSub = document.getElementById('addressSub');
    const mapStatus = document.getElementById('mapStatus');
    const normalMapBtn = document.getElementById('normalMapBtn');
    const airMapBtn = document.getElementById('airMapBtn');
    const backBtn = document.getElementById('backBtn');

    let kakaoGeocoder = null;
    let kakaoPlaces = null;
    let map = null;
    let baseLayer = null;
    let baseSource = null;
    let markerLayer = null;
    let markerFeature = null;
    let pendingLocation = null;
    let mapLibPromise = null;

    function setSearchMessage(text, error = false) {
      searchMessage.textContent = text;
      searchMessage.classList.toggle('error', error);
    }

    function buildDayRows() {
      const labels = ['일', '월', '화', '수', '목', '금', '토'];
      const today = new Date().getDay();
      document.querySelectorAll('.js-days').forEach(container => {
        container.innerHTML = '';
        // 화면 표시는 월~일 순서
        [1,2,3,4,5,6,0].forEach(dayIndex => {
          const el = document.createElement('div');
          el.className = 'day' + (dayIndex === today ? ' today' : '');
          el.textContent = labels[dayIndex];
          container.appendChild(el);
        });
      });
    }

    function loadKakaoServices() {
      return new Promise((resolve, reject) => {
        if (window.kakao?.maps?.services) {
          kakaoGeocoder = new kakao.maps.services.Geocoder();
          kakaoPlaces = new kakao.maps.services.Places();
          resolve();
          return;
        }

        const script = document.createElement('script');
        script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JAVASCRIPT_KEY)}&libraries=services&autoload=false`;
        script.onload = () => {
          if (!window.kakao?.maps) {
            reject(new Error('Kakao SDK가 로드되지 않았습니다.'));
            return;
          }
          kakao.maps.load(() => {
            kakaoGeocoder = new kakao.maps.services.Geocoder();
            kakaoPlaces = new kakao.maps.services.Places();
            resolve();
          });
        };
        script.onerror = () => reject(new Error('Kakao SDK 호출 실패'));
        document.head.appendChild(script);
      });
    }

    function loadScriptOnce(src, testFn) {
      return new Promise((resolve, reject) => {
        if (typeof testFn === 'function' && testFn()) { resolve(); return; }
        const existing = [...document.scripts].find(s => s.src === src);
        if (existing) {
          existing.addEventListener('load', resolve, { once: true });
          existing.addEventListener('error', () => reject(new Error(`스크립트 호출 실패: ${src}`)), { once: true });
          return;
        }
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`스크립트 호출 실패: ${src}`));
        document.head.appendChild(script);
      });
    }

    function loadMapLibraries() {
      if (mapLibPromise) return mapLibPromise;
      mapLibPromise = (async () => {
        await loadScriptOnce('https://cdn.jsdelivr.net/npm/ol@6.4.3/dist/ol.js', () => !!window.ol);
        await loadScriptOnce('https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js', () => !!window.proj4);

        proj4.defs('EPSG:5179', '+proj=tmerc +lat_0=38 +lon_0=127.5 +k=0.9996 +x_0=1000000 +y_0=2000000 +ellps=GRS80 +units=m +no_defs');
        ol.proj.proj4.register(proj4);
        const p5179 = ol.proj.get('EPSG:5179');
        p5179.setExtent([-200000.0, -28024123.62, 31824123.62, 4000000.0]);
      })();
      return mapLibPromise;
    }

    function createNgiiBaseSource() {
      const projection = ol.proj.get('EPSG:5179');
      const resolutions = [2088.96, 1044.48, 522.24, 261.12, 130.56, 65.28, 32.64, 16.32, 8.16, 4.08, 2.04, 1.02, 0.51, 0.255];
      const matrixIds = ['L05','L06','L07','L08','L09','L10','L11','L12','L13','L14','L15','L16','L17','L18'];
      const tileGrid = new ol.tilegrid.WMTS({
        origin: [-200000.0, 4000000.0],
        resolutions,
        matrixIds
      });

      const source = new ol.source.WMTS({
        url: `https://map.ngii.go.kr/openapi/Gettile.do?apikey=${encodeURIComponent(NGII_API_KEY)}`,
        layer: 'korean_map',
        matrixSet: 'EPSG:5179',
        format: 'image/png',
        projection,
        tileGrid,
        style: 'korean',
        wrapX: false,
        crossOrigin: 'anonymous',
        attributions: '국토지리정보원'
      });

      let loaded = false;
      let errors = 0;
      source.on('tileloadend', () => {
        if (!loaded) {
          loaded = true;
          mapStatus.textContent = '국토지리정보원 배경지도';
        }
      });
      source.on('tileloaderror', () => {
        errors += 1;
        if (errors >= 2 && !loaded) {
          mapStatus.textContent = 'NGII 지도 타일을 받지 못했습니다. 인증키의 서비스 승인 상태를 확인해주세요.';
        }
      });
      return source;
    }

    async function initNgiiMap() {
      if (map) return;
      await loadMapLibraries();

      baseSource = createNgiiBaseSource();
      baseLayer = new ol.layer.Tile({ source: baseSource });

      markerFeature = new ol.Feature({ geometry: new ol.geom.Point([998784, 1850409]) });
      markerFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: '#171816' }),
          stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 })
        })
      }));
      markerLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [markerFeature] })
      });

      map = new ol.Map({
        target: 'map',
        layers: [baseLayer, markerLayer],
        view: new ol.View({
          projection: 'EPSG:5179',
          center: [998784, 1850409],
          zoom: 13,
          minZoom: 5,
          maxZoom: 18,
          constrainResolution: true
        }),
        controls: ol.control.defaults({ attributionOptions: { collapsible: true } })
      });

      // 영상지도는 NGII 원본 AIRPHOTO가 HTTP 전용이라 GitHub Pages(HTTPS)에서 직접 로드할 수 없습니다.
      airMapBtn.addEventListener('click', () => {
        normalMapBtn.classList.add('active');
        airMapBtn.classList.remove('active');
        normalMapBtn.setAttribute('aria-pressed', 'true');
        airMapBtn.setAttribute('aria-pressed', 'false');
        mapStatus.textContent = 'NGII 영상지도는 HTTPS에서 직접 제공되지 않습니다. 배경지도를 표시합니다.';
      });
      normalMapBtn.addEventListener('click', () => {
        normalMapBtn.classList.add('active');
        airMapBtn.classList.remove('active');
        normalMapBtn.setAttribute('aria-pressed', 'true');
        airMapBtn.setAttribute('aria-pressed', 'false');
        mapStatus.textContent = '국토지리정보원 배경지도';
      });

      if (pendingLocation) moveNgiiMap(pendingLocation.lat, pendingLocation.lng);

      setTimeout(() => {
        if (mapStatus.textContent.includes('불러오는 중')) {
          mapStatus.textContent = '지도 타일 응답 대기 중… 오래 지속되면 NGII 인증키 승인 상태를 확인해주세요.';
        }
      }, 8000);
    }

    function moveNgiiMap(lat, lng) {
      pendingLocation = { lat, lng };
      if (!map || !window.ol) return;
      const xy = ol.proj.transform([Number(lng), Number(lat)], 'EPSG:4326', 'EPSG:5179');
      markerFeature?.getGeometry().setCoordinates(xy);
      map.getView().setCenter(xy);
      map.getView().setZoom(16);
      setTimeout(() => map.updateSize(), 50);
    }

    async function showResult(address, lat, lng) {
      selectedAddress.textContent = address;
      addressSub.textContent = `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)} · 현재 시범 수거일정`;
      searchScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      window.scrollTo(0, 0);
      pendingLocation = { lat, lng };

      mapStatus.textContent = map ? '국토지리정보원 배경지도' : '국토지리정보원 지도 불러오는 중…';
      if (!map) {
        try {
          await initNgiiMap();
        } catch (err) {
          console.error(err);
          mapStatus.textContent = '지도를 초기화하지 못했습니다. 브라우저 개발자도구 Console을 확인해주세요.';
          return;
        }
      }
      moveNgiiMap(lat, lng);
      setTimeout(() => map?.updateSize(), 120);
    }

    function searchAddress(query) {
      const keyword = query.trim();
      if (!keyword) {
        setSearchMessage('주소를 입력해주세요.', true);
        firstAddressInput.focus();
        return;
      }
      if (!kakaoGeocoder || !kakaoPlaces) {
        setSearchMessage('주소검색 서비스를 준비 중입니다. 잠시 후 다시 눌러주세요.', true);
        return;
      }

      setSearchMessage('주소를 찾는 중…');
      kakaoGeocoder.addressSearch(keyword, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result.length) {
          const first = result[0];
          const address = first.road_address?.address_name || first.address_name || keyword;
          setSearchMessage('');
          showResult(address, Number(first.y), Number(first.x));
          return;
        }

        kakaoPlaces.keywordSearch(keyword, (places, placeStatus) => {
          if (placeStatus === kakao.maps.services.Status.OK && places.length) {
            const first = places[0];
            const address = first.road_address_name || first.address_name || first.place_name || keyword;
            setSearchMessage('');
            showResult(address, Number(first.y), Number(first.x));
          } else {
            setSearchMessage('주소를 찾지 못했습니다. 도로명 주소나 건물명을 조금 더 자세히 입력해주세요.', true);
          }
        });
      });
    }

    firstSearchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      searchAddress(firstAddressInput.value);
    });

    backBtn.addEventListener('click', () => {
      resultScreen.classList.add('hidden');
      searchScreen.classList.remove('hidden');
      setSearchMessage('');
      setTimeout(() => {
        firstAddressInput.focus();
        firstAddressInput.select();
      }, 30);
    });


    buildDayRows();

    // 첫 화면에서는 주소검색만 준비합니다. 지도 라이브러리는 검색 성공 후에 로드합니다.
    loadKakaoServices().catch(() => {
      setSearchMessage('카카오 주소검색 API를 불러오지 못했습니다. Kakao Developers 허용 도메인을 확인해주세요.', true);
    });
  </script>
</body>
</html>
