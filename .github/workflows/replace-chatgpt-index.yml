name: Replace ChatGPT index

on:
  push:
    paths:
      - 'tools/chatgpt_replace.ready'

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild index.html from staged archive
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/chatgpt_replace.ready
          test -n "$(ls tools/chatgpt_index.b64.part* 2>/dev/null)"
          cat tools/chatgpt_index.b64.part* | base64 -d | gzip -d > index.html

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = '\n'.join(re.findall(r'<script>(.*?)</script>', text, flags=re.S))
          Path('/tmp/index-inline.js').write_text(scripts, encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/chatgpt_replace.ready tools/chatgpt_index.b64.part*
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/chatgpt_replace.ready tools/chatgpt_index.b64.part*
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Replace index.html with ChatGPT build'
          git push
