name: Optimize external route bundle
on:
  push:
    paths: ['tools/precomputed-route-optimize.trigger']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/precomputed_route_optimize.py
      - name: Validate route-only bundle and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'data-src="(data/precomputed-routes-[^"]+\.json)"',s)
          assert m
          d=json.loads(Path(m.group(1)).read_text(encoding='utf-8'))
          assert len(d.get('routes') or [])==94
          assert 'zones' not in d
          assert Path('index.html').stat().st_size<500000
          print('ROUTE_BUNDLE_VALIDATION_OK',Path(m.group(1)).stat().st_size)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          main=max(scripts,key=len)
          Path('/tmp/cjwaste-main.js').write_text(main,encoding='utf-8')
          PY
          node --check /tmp/cjwaste-main.js
      - name: Commit route bundle optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data tools/precomputed-route-optimize-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "Trim stale zones from external route bundle"
          git push
