name: Test lazy service-zone rendering

on:
  push:
    paths:
      - 'cjwaste-test/index.html'
      - '.github/workflows/test-lazy-zone-render.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployed lazy-render test page
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -fsSL "https://yongseongk94.github.io/cjwaste/cjwaste-test/?lazy_check=$RANDOM" -o /tmp/test-live.html \
              && grep -q "TEST_ZONE_RENDER_MODE='coarse-cover-v2'" /tmp/test-live.html \
              && grep -q "TEST_ROUTE_PRIORITY_MODE='address-first-v4-shared-geometry'" /tmp/test-live.html; then
              echo 'Lazy-render test page deployed'
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify raw matching and viewport-only polygons
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          export CHROME_BIN
          cat > lazy-zone-test.js <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://yongseongk94.github.io/cjwaste/cjwaste-test/?lazy_verify='+Date.now(),{
              waitUntil:'domcontentloaded',timeout:120000
            });
            await page.waitForFunction(()=>typeof geocoder!=='undefined'&&!!geocoder,{timeout:120000});
            await new Promise(r=>setTimeout(r,1200));
            const landing=await page.evaluate(()=>({mode:TEST_ZONE_RENDER_MODE,
              display:(serviceZoneOverlays.general||[]).filter(z=>!z.manual).length,
              raw:[...rawServiceZones.general.values()].reduce((n,a)=>n+a.length,0)
            }));
            if(landing.mode!=='coarse-cover-v2')throw new Error('Wrong deployed renderer: '+JSON.stringify(landing));
            if(landing.display!==0)throw new Error('Landing created non-manual polygons: '+JSON.stringify(landing));

            const t0=Date.now();
            await page.type('#landingInput','청주시 청원구 상당로 230');
            await page.click('#landingForm button[type=submit]');
            await page.waitForFunction(()=>document.getElementById('landing').classList.contains('hidden'),{timeout:120000});
            await page.waitForFunction(()=>(rawServiceZones.general.get('우암동')||[]).length>=500,{timeout:120000});
            await page.waitForFunction(()=>(serviceZoneOverlays.general||[]).filter(z=>!z.manual&&z.polygon?.getMap?.()).length>0,{timeout:120000});
            const routeStart=Date.now();
            await page.waitForFunction(()=>(dongRouteOverlays.general||[]).some(item=>routeItemPolylines(item).some(pl=>pl?.getMap?.())),{timeout:60000});
            const routeReadyMs=Date.now()-routeStart;
            await new Promise(r=>setTimeout(r,300));

            const result=await page.evaluate(()=>({
              ms:Date.now(),
              district:document.getElementById('selectedDistrict')?.textContent||'',
              badge:document.getElementById('generalBadge')?.textContent||'',
              detail:document.getElementById('generalDetail')?.textContent||'',
              display:(serviceZoneOverlays.general||[]).filter(z=>!z.manual&&z.polygon?.getMap?.()).length,
              objects:(serviceZoneOverlays.general||[]).filter(z=>!z.manual).length,
              raw:[...rawServiceZones.general.values()].reduce((n,a)=>n+a.length,0),
              uamRaw:(rawServiceZones.general.get('우암동')||[]).length,
              coarseCoverCount:(serviceZoneOverlays.general||[]).filter(z=>z.displayOnly&&z.coarseCover).length,
              coarseCoverage:(()=>{
                const raw=(rawServiceZones.general.get('우암동')||[]);
                const cover=(serviceZoneOverlays.general||[]).filter(z=>z.displayOnly&&z.coarseCover);
                let total=0,hit=0;
                for(const z of raw){
                  const b=rawZoneBounds(z);if(!b)continue;
                  total++;
                  const lat=(b.minLat+b.maxLat)/2,lng=(b.minLng+b.maxLng)/2;
                  if(cover.some(c=>pointInZonePolygon(lat,lng,c)))hit++;
                }
                return {total,hit,ratio:total?hit/total:0};
              })(),
              rawMatch:!!serviceZoneOverlayMatch('general',{district:'우암동',legalEmd:'우암동',legalRi:'',lat:currentLat,lng:currentLng}),
              routeObjects:(dongRouteOverlays.general||[]).length,
              routeVisible:(dongRouteOverlays.general||[]).filter(item=>routeItemPolylines(item).some(pl=>pl?.getMap?.())).length,
              routePolylineRefs:(dongRouteOverlays.general||[]).reduce((n,item)=>n+routeItemPolylines(item).length,0),
              routeUniquePolylineObjects:new Set((dongRouteOverlays.general||[]).flatMap(item=>routeItemPolylines(item))).size,
              routeUniqueVisiblePolylines:new Set((dongRouteOverlays.general||[]).flatMap(item=>routeItemPolylines(item).filter(pl=>pl?.getMap?.()))).size,
              routeGeometryGroups:new Set((dongRouteOverlays.general||[]).map(item=>item.geometryKey||routeGeometryKey(item))).size,
              uam1536Groups:new Set((dongRouteOverlays.general||[]).filter(item=>String(item.vehicle).includes('88어1536')).map(item=>item.geometryKey||routeGeometryKey(item))).size,
              uam1536Days:(dongRouteOverlays.general||[]).filter(item=>String(item.vehicle).includes('88어1536')).length,
              routeSelection:routeCandidatesForSelection('general').map(s=>({vehicle:s.vehicle,day:s.day,districts:s.districts,provider:s.provider})).slice(0,50),
              selectedVehicle:selectedVehicle.general,
              activeDay,
              routePriorityMode:TEST_ROUTE_PRIORITY_MODE
            }));
            result.routeReadyMs=routeReadyMs;
            result.elapsedMs=Date.now()-t0;
            console.log('LAZY_ZONE_RESULT',JSON.stringify(result));
            if(!result.district.includes('우암동'))throw new Error('Address did not resolve to Uam: '+JSON.stringify(result));
            if(result.badge.includes('미확정')||result.detail.includes('권역 미확정'))throw new Error('Uam still unresolved: '+JSON.stringify(result));
            if(result.uamRaw<500)throw new Error('Uam raw precision data missing: '+JSON.stringify(result));
            if(result.display<=0)throw new Error('No viewport polygons rendered: '+JSON.stringify(result));
            if(result.display>24)throw new Error('Too many coarse cover polygons: '+JSON.stringify(result));
            if(result.objects>28)throw new Error('Too many coarse cover polygon objects created: '+JSON.stringify(result));
            if(result.coarseCoverCount<=0)throw new Error('No coarse cover polygons rendered: '+JSON.stringify(result));
            if((result.coarseCoverage?.ratio||0)<0.92)throw new Error('Coarse cover leaves too many visual gaps: '+JSON.stringify(result.coarseCoverage));
            if(!result.rawMatch)throw new Error('Raw-zone address match failed: '+JSON.stringify(result));
            console.log('ROUTE_DIAG',JSON.stringify({routeObjects:result.routeObjects,routeVisible:result.routeVisible,routePolylineRefs:result.routePolylineRefs,routeUniquePolylineObjects:result.routeUniquePolylineObjects,routeUniqueVisiblePolylines:result.routeUniqueVisiblePolylines,routeGeometryGroups:result.routeGeometryGroups,uam1536Groups:result.uam1536Groups,uam1536Days:result.uam1536Days,selectedVehicle:result.selectedVehicle,activeDay:result.activeDay,routeReadyMs:result.routeReadyMs,routeSelection:result.routeSelection}));
            if(result.routePriorityMode!=='address-first-v4-shared-geometry')throw new Error('Wrong route loader version: '+JSON.stringify(result));
            if(result.routeVisible<=0)throw new Error('Evidence route is not visible: '+JSON.stringify(result));
            if(result.routeReadyMs>2500)throw new Error('Evidence route is too slow: '+JSON.stringify(result));
            if(!(result.uam1536Days>=6&&result.uam1536Groups<=3))throw new Error('Contractor weekday geometry was not grouped: '+JSON.stringify(result));
            if(!(result.routeUniquePolylineObjects<result.routePolylineRefs))throw new Error('Polyline sharing did not reduce objects: '+JSON.stringify(result));

            await page.evaluate(()=>setDay('수'));
            await page.waitForFunction(()=>activeDay==='수'&&(dongRouteOverlays.general||[]).some(item=>item.day==='수'&&routeItemPolylines(item).some(pl=>pl?.getMap?.())),{timeout:30000});
            const wed=await page.evaluate(()=>({day:activeDay,visible:new Set((dongRouteOverlays.general||[]).flatMap(item=>item.day==='수'?routeItemPolylines(item).filter(pl=>pl?.getMap?.()):[])).size}));

            await page.evaluate(()=>setDay('화'));
            await page.waitForFunction(()=>activeDay==='화'&&(dongRouteOverlays.general||[]).some(item=>item.day==='화'&&routeItemPolylines(item).some(pl=>pl?.getMap?.())),{timeout:30000});
            const tue=await page.evaluate(()=>({day:activeDay,visible:new Set((dongRouteOverlays.general||[]).flatMap(item=>item.day==='화'?routeItemPolylines(item).filter(pl=>pl?.getMap?.()):[])).size}));
            if(wed.visible<=0||tue.visible<=0)throw new Error('Shared route weekday filter regression: '+JSON.stringify({wed,tue}));
            console.log('ROUTE_DAY_FILTERS',JSON.stringify({wed,tue}));
            await page.evaluate(()=>setDay('전체'));
            if(!result.routeSelection?.length||!result.routeSelection[0].districts?.includes('우암동')||!String(result.routeSelection[0].vehicle).includes('88어1536'))throw new Error('Address route is not first priority: '+JSON.stringify(result.routeSelection?.slice(0,6)));
            if(errors.length)throw new Error('Page errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node lazy-zone-test.js
