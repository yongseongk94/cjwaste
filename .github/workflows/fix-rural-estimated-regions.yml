name: Fix rural estimated regions
on:
  push:
    paths: ['tools/fix-rural-estimated-regions.trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_rural_estimated_regions.py
      - run: |
          grep -F 'zone-v78-rural-estimated-regions-fix' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Naesu Bugi estimated region generation'
          git push
