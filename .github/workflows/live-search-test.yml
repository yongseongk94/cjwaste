name: Live address search test

on:
  push:
    paths:
      - 'tools/live-search-test.trigger'

permissions:
  contents: write

jobs:
  test-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect initialization order
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== DISTRICT_ALIASES / canonicalDistrict / RURAL markers ==='
            grep -n -E "DISTRICT_ALIASES|canonicalDistrict\(|RURAL_INFERRED_ROUTE_DISTRICTS|RURAL_ROUTE_MATCH_KM" index.html | head -n 120 || true
          } > tools/live_test.txt
      - name: Commit test result
        shell: bash
        run: |
          rm -f tools/live-search-test.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/live_test.txt tools/live-search-test.trigger
          git commit -m 'Record initialization-order diagnostic'
          git push
