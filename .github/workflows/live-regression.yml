name: Live homepage regression
on:
  push:
    paths: ['tools/live-regression.trigger']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Run live regression
        run: python tools/live_regression.py
      - name: Commit regression report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f tools/live-regression-report.json || echo '{"fatal":"report not generated"}' > tools/live-regression-report.json
          git add tools/live-regression-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Record live homepage regression result"
          git push
