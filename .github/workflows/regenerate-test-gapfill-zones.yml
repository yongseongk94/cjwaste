name: Regenerate test gap-fill service zones

on:
  push:
    paths:
      - '.github/workflows/regenerate-test-gapfill-zones.yml'
      - 'tools/regenerate-test-gapfill.trigger'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Uam gap-fill test page deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            if curl -fsSL "https://yongseongk94.github.io/cjwaste/cjwaste-test/?gapfill_v3_check=$RANDOM" -o /tmp/test-live.html \
              && grep -q 'zone-v90-test-gapfill-v3' /tmp/test-live.html \
              && grep -q 'service-zones-gapfill-v3-manifest.json' /tmp/test-live.html; then
              echo 'Uam gap-fill v3 test page is deployed'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for Uam gap-fill v3 deployment' >&2
          exit 1

      - name: Regenerate Uam zones in browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          export CHROME_BIN
          cat > regenerate-test-zones.js <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              protocolTimeout:1200000,
              executablePath:process.env.CHROME_BIN,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            page.setDefaultTimeout(1200000);
            const pageErrors=[];
            page.on('pageerror',e=>{pageErrors.push(e.message);console.error('PAGEERROR',e.message)});
            page.on('console',m=>{
              const t=m.text();
              if (/precompute complete|행정동|법정리|실패|error/i.test(t)) console.log('PAGE',t.slice(0,1200));
            });
            await page.goto('https://yongseongk94.github.io/cjwaste/cjwaste-test/?zone_only=1&zone_district='+encodeURIComponent('우암동')+'&gapfill_v3='+Date.now(),{
              waitUntil:'domcontentloaded',timeout:180000
            });
            await page.waitForFunction(()=>window.__CJWASTE_PRECOMPUTE_READY===true,{timeout:900000,polling:1500});
            const payload=await page.evaluate(async()=>{
              const data=window.exportCjWastePrecomputed();
              const expected='zone-v90-test-gapfill-v3|v76-layer-visibility-refresh';
              if(data?.zoneVersion!==expected)throw new Error('Unexpected zoneVersion '+data?.zoneVersion);

              async function coverage(type){
                const district='우암동';
                const feature=districtFeatureMap.get(district);
                if(!feature)return {district,type,error:'missing feature'};
                const groups=await serviceRouteGroups(type,district,'','');
                const b=featureBounds(feature);
                const stepLat=.00016,stepLng=.00020;
                let inside=0,route20=0,zone=0,uncovered=0;
                const samples=[];
                for(let lat=b.minLat+stepLat/2;lat<b.maxLat;lat+=stepLat){
                  for(let lng=b.minLng+stepLng/2;lng<b.maxLng;lng+=stepLng){
                    if(!pointInGeoFeature([lng,lat],feature))continue;
                    inside++;
                    const near=groups.some(g=>serviceGroupRouteDistanceKm(g,lat,lng)<=MAX_ADDRESS_ROUTE_DISTANCE_KM);
                    if(near){route20++;continue}
                    const hit=serviceZoneOverlayMatch(type,{district,legalEmd:district,legalRi:'',lat,lng});
                    if(hit)zone++;
                    else{
                      uncovered++;
                      if(samples.length<20)samples.push({lat:+lat.toFixed(6),lng:+lng.toFixed(6)});
                    }
                  }
                }
                return {district,type,inside,route20,zone,uncovered,uncoveredRate:inside?uncovered/inside:1,samples};
              }

              const diagnostics={general:await coverage('general'),recycle:await coverage('recycle')};
              return {data,diagnostics};
            });
            fs.writeFileSync('/tmp/test-zones-uam.json',JSON.stringify(payload.data));
            fs.writeFileSync('/tmp/test-zone-uam-diagnostics.json',JSON.stringify(payload.diagnostics,null,2));
            console.log('UAM_DIAGNOSTICS',JSON.stringify(payload.diagnostics));
            if(pageErrors.length)console.warn('Page errors:',pageErrors.join(' | '));

            for(const type of ['general','recycle']){
              const zones=(payload.data?.zones?.[type]||[]).filter(z=>z.district==='우암동');
              if(!zones.length)throw new Error(type+' Uam zones missing');
              const d=payload.diagnostics[type];
              if(d.error)throw new Error(type+' Uam diagnostic: '+d.error);
              if(d.uncovered>0)throw new Error(type+' Uam uncovered samples: '+JSON.stringify(d));
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node regenerate-test-zones.js

      - name: Build isolated v3 test chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          root=Path('.')
          fresh=json.loads(Path('/tmp/test-zones-uam.json').read_text(encoding='utf-8'))
          diagnostics=json.loads(Path('/tmp/test-zone-uam-diagnostics.json').read_text(encoding='utf-8'))
          version='zone-v90-test-gapfill-v3|v76-layer-visibility-refresh'
          assert fresh['zoneVersion']==version
          slugs={'우암동':'uam','내덕1동':'naedeok1','내덕2동':'naedeok2','오근장동':'ogeunjang','율량사천동':'yullyang-sacheon','오창읍':'ochang','내수읍':'naesu','북이면':'bugi'}

          out=root/'cjwaste-test'/'data'/'zones-gapfill-v3'
          if out.exists(): shutil.rmtree(out)
          manifest={'schemaVersion':1,'zoneVersion':version,'strategy':'uam-gapfill-v3-with-v90-preserved-others','types':{'general':[],'recycle':[]}}

          def points(z):
            rings=z.get('rings') or [z.get('points') or []]
            for ring in rings:
              for p in ring:
                try: yield float(p['lat']),float(p['lng'])
                except Exception: pass
          def bbox(zones):
            pts=[p for z in zones for p in points(z)]
            if not pts:return None
            return {'minLat':min(x[0] for x in pts),'maxLat':max(x[0] for x in pts),'minLng':min(x[1] for x in pts),'maxLng':max(x[1] for x in pts)}

          for typ in ('general','recycle'):
            fresh_uam=[z for z in fresh.get('zones',{}).get(typ,[]) if z.get('district')=='우암동']
            assert fresh_uam,(typ,'fresh Uam missing')
            for district,slug in slugs.items():
              if district=='우암동':
                zs=fresh_uam
              else:
                old_path=root/f'cjwaste-test/data/zones/{typ}/{slug}.json'
                old=json.loads(old_path.read_text(encoding='utf-8'))
                zs=old.get('zones',[])
                assert zs,(typ,district,'preserved chunk empty')
              p=f'cjwaste-test/data/zones-gapfill-v3/{typ}/{slug}.json'
              fp=root/p;fp.parent.mkdir(parents=True,exist_ok=True)
              fp.write_text(json.dumps({'schemaVersion':1,'zoneVersion':version,'type':typ,'district':district,'zones':zs},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              manifest['types'][typ].append({'district':district,'path':p,'count':len(zs),'bbox':bbox(zs)})

          (root/'cjwaste-test/data/service-zones-gapfill-v3-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'cjwaste-test/data/service-zones-gapfill-v3-diagnostics.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          oldg=json.loads((root/'cjwaste-test/data/zones/general/uam.json').read_text(encoding='utf-8'))['zones']
          oldr=json.loads((root/'cjwaste-test/data/zones/recycle/uam.json').read_text(encoding='utf-8'))['zones']
          newg=[z for z in fresh['zones']['general'] if z.get('district')=='우암동']
          newr=[z for z in fresh['zones']['recycle'] if z.get('district')=='우암동']
          print('UAM_COUNTS',{'general':{'old':len(oldg),'new':len(newg)},'recycle':{'old':len(oldr),'new':len(newr)}})
          print('UAM_DIAGNOSTICS',json.dumps(diagnostics,ensure_ascii=False))
          PY

      - name: Commit regenerated test-only v3 chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -f regenerate-test-zones.js package.json package-lock.json tools/regenerate-test-gapfill.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cjwaste-test/data/service-zones-gapfill-v3-manifest.json \
                  cjwaste-test/data/service-zones-gapfill-v3-diagnostics.json \
                  cjwaste-test/data/zones-gapfill-v3 \
                  tools/regenerate-test-gapfill.trigger
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'Regenerate Uam edge-safe zones for test page'
          git push
