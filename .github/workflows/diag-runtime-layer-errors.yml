name: Diagnose runtime layer errors
on:
  push:
    paths:
      - 'tools/diag-runtime-layer-errors.trigger'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          export CHROME_BIN
          node - <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            const errors=[]; const consoleErrors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('https://yongseongk94.github.io/cjwaste/?runtimeLayerDiag2='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await new Promise(r=>setTimeout(r,8000));
            const state=await page.evaluate(()=>{
              const allRoutes=typeof dongRouteOverlays==='undefined'?[]:Object.values(dongRouteOverlays).flat();
              const rpls=[];
              for(const x of allRoutes){
                try{ if(typeof routeItemPolylines==='function') rpls.push(...routeItemPolylines(x)); }catch(e){}
              }
              const allZones=typeof serviceZoneOverlays==='undefined'?[]:Object.values(serviceZoneOverlays).flat();
              return {
                activeLayer:typeof activeLayer==='undefined'?'undefined':activeLayer,
                serviceLayerState:typeof serviceLayerState==='undefined'?null:serviceLayerState,
                routeItems:allRoutes.length,
                routePolylineCount:rpls.length,
                visibleRoutePolylines:rpls.filter(pl=>pl?.getMap&&pl.getMap()).length,
                visibleRouteSample:rpls.slice(0,3).map(pl=>({map:!!pl?.getMap?.(),strokeOpacity:pl?.getStrokeOpacity?.(),strokeWeight:pl?.getStrokeWeight?.()})),
                zoneItems:allZones.length,
                visibleZones:allZones.filter(x=>x.polygon?.getMap&&x.polygon.getMap()).length,
                zoneSample:allZones.slice(0,3).map(x=>({map:!!x.polygon?.getMap?.(),district:x.district,estimated:x.estimated,gridMerged:x.gridMerged,polygonized:x.polygonized})),
                mapLevel:typeof map==='undefined'?null:map.getLevel(),
                mapCenter:typeof map==='undefined'?null:{lat:map.getCenter().getLat(),lng:map.getCenter().getLng()},
                badge:document.getElementById('mapBadge')?.innerText||''
              };
            });
            state.pageErrors=errors;state.consoleErrors=consoleErrors;
            fs.writeFileSync('tools/runtime_layer_report.json',JSON.stringify(state,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/diag-runtime-layer-errors.trigger
          git add tools/runtime_layer_report.json tools/diag-runtime-layer-errors.trigger
          git commit -m 'Record runtime layer diagnostic v2'
          git pull --rebase origin main
          git push
