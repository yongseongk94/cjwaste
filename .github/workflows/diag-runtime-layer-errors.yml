name: Diagnose runtime layer errors
on:
  push:
    paths:
      - 'tools/diag-runtime-layer-errors.trigger'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          export CHROME_BIN
          node - <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            const errors=[]; const consoleErrors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('https://yongseongk94.github.io/cjwaste/?runtimeLayerDiag='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await new Promise(r=>setTimeout(r,8000));
            const state=await page.evaluate(()=>({
              activeLayer:typeof activeLayer==='undefined'?'undefined':activeLayer,
              serviceLayerState:typeof serviceLayerState==='undefined'?null:serviceLayerState,
              mapReady:!!window.map,
              routeCounts:typeof dongRouteOverlays==='undefined'?null:{general:dongRouteOverlays.general?.length||0,recycle:dongRouteOverlays.recycle?.length||0},
              zoneCounts:typeof serviceZoneOverlays==='undefined'?null:{general:serviceZoneOverlays.general?.length||0,recycle:serviceZoneOverlays.recycle?.length||0},
              visibleRoutes:typeof dongRouteOverlays==='undefined'?null:Object.values(dongRouteOverlays).flat().filter(x=>(x.segments||[]).some(s=>s.getMap&&s.getMap())).length,
              visibleZones:typeof serviceZoneOverlays==='undefined'?null:Object.values(serviceZoneOverlays).flat().filter(x=>x.polygon?.getMap&&x.polygon.getMap()).length,
              badge:document.getElementById('mapBadge')?.innerText||'',
              structure:document.getElementById('structureControl')?.innerText||''
            }));
            state.pageErrors=errors;state.consoleErrors=consoleErrors;
            fs.writeFileSync('tools/runtime_layer_report.json',JSON.stringify(state,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: |
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/diag-runtime-layer-errors.trigger
          git add tools/runtime_layer_report.json tools/diag-runtime-layer-errors.trigger
          git commit -m 'Record runtime layer diagnostic'
          git pull --rebase origin main
          git push
