name: Freeze precomputed map data now

on:
  push:
    paths:
      - 'tools/freeze_precomputed_now.ready'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for deployed v69 merged zones
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsSL "https://yongseongk94.github.io/cjwaste/?check=$RANDOM" -o /tmp/cjwaste-live.html && grep -q 'zone-v69-merged-grid-blocks' /tmp/cjwaste-live.html; then
              echo 'v69 merged service zones are deployed'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for v69 Pages deployment' >&2
          exit 1
      - name: Capture exact geometry from deployed v69
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          export CHROME_BIN
          cat >freeze.js <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,protocolTimeout:1200000,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            page.setDefaultTimeout(1200000);
            page.on('console',msg=>console.log('PAGE',msg.text()));
            page.on('pageerror',err=>console.error('PAGEERROR',err.message));
            await page.goto('https://yongseongk94.github.io/cjwaste/?precompute='+Date.now(),{waitUntil:'domcontentloaded',timeout:180000});
            await page.waitForFunction(()=>typeof window.exportCjWastePrecomputed==='function',{timeout:180000});
            await page.waitForFunction(()=>window.__CJWASTE_PRECOMPUTE_READY===true,{timeout:1200000,polling:1000});
            await page.waitForFunction(()=>{
              const d=window.exportCjWastePrecomputed?.();
              return !!(d?.zones?.general?.length&&d?.zones?.recycle?.length);
            },{timeout:1200000,polling:2000});
            const data=await page.evaluate(()=>window.exportCjWastePrecomputed());
            if(!data?.routes?.length) throw new Error('No routes exported');
            if(!data?.zones?.general?.length || !data?.zones?.recycle?.length) throw new Error('No service zones exported');
            if(data.zoneVersion!=='zone-v69-merged-grid-blocks|'+data.version) throw new Error('Unexpected zone version: '+data.zoneVersion);
            const estimated={general:(data.zones.general||[]).filter(z=>z.estimated).length,recycle:(data.zones.recycle||[]).filter(z=>z.estimated).length};
            const merged={general:(data.zones.general||[]).filter(z=>z.gridMerged).length,recycle:(data.zones.recycle||[]).filter(z=>z.gridMerged).length};
            fs.writeFileSync('/tmp/precomputed.json',JSON.stringify(data));
            console.log('ESTIMATED_MERGED_ZONES',JSON.stringify(estimated));
            console.log('GRID_MERGED_BLOCKS',JSON.stringify(merged));
            console.log(`EXPORTED routes=${data.routes.length} generalZones=${data.zones.general.length} recycleZones=${data.zones.recycle.length}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node freeze.js
      - name: Embed data and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          data=Path('/tmp/precomputed.json').read_text(encoding='utf-8')
          pat=r'(<script id="bundledPrecomputed" type="application/json">).*?(</script>)'
          text,n=re.subn(pat,lambda m:m.group(1)+data+m.group(2),text,count=1,flags=re.S)
          if n!=1: raise SystemExit('precomputed slot missing')
          p.write_text(text,encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',text,flags=re.S))
          Path('/tmp/index-inline.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit embedded data
        shell: bash
        run: |
          set -euo pipefail
          rm -f freeze.js package.json package-lock.json tools/freeze_precomputed_now.ready tools/freeze_precomputed.ready
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/
          if git diff --cached --quiet; then
            echo 'No precomputed changes to commit.'
            exit 0
          fi
          git commit -m 'Embed v69 merged service-zone blocks'
          git push
