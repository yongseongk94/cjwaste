name: Apply v72 route reliability

on:
  push:
    paths:
      - 'tools/v72-route-reliability.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v72 patch
        run: python3 tools/apply_v72_route_reliability.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=['v72-road-retry-no-straight','zone-v72-road-retry-no-straight','도로망 수거노선 최종 실패, 직선 대체 없이 해당 구간을 제외합니다.']
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/index-inline.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit v72
        shell: bash
        run: |
          rm -f tools/v72-route-reliability.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/v72-route-reliability.trigger
          git commit -m 'Retry road routing and remove straight fallbacks'
          git push
