name: Fix v79 district aliases for rural route preload

on:
  push:
    paths:
      - 'tools/v79-district-aliases.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch district aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=(
              "const DISTRICT_ALIASES={\n"
              "  '내수읍':'내수읍','오창읍':'오창읍','북이면':'북이면','우암동':'우암동','내덕1동':'내덕1동','내덕2동':'내덕2동','오근장동':'오근장동',\n"
              "  '율량사천동':'율량사천동','율량·사천동':'율량사천동','율량.사천동':'율량사천동'\n"
              "};"
          )
          new=(
              "const DISTRICT_ALIASES={\n"
              "  '내수읍':'내수읍','오창읍':'오창읍','북이면':'북이면','우암동':'우암동',\n"
              "  '내덕1동':'내덕1동','내덕제1동':'내덕1동','내덕2동':'내덕2동','내덕제2동':'내덕2동','오근장동':'오근장동',\n"
              "  '율량사천동':'율량사천동','율량·사천동':'율량사천동','율량.사천동':'율량사천동'\n"
              "};"
          )
          if s.count(old)!=1:
              raise SystemExit(f'expected alias block once, found {s.count(old)}')
          s=s.replace(old,new,1)
          if "'내덕제1동':'내덕1동'" not in s or "'내덕제2동':'내덕2동'" not in s:
              raise SystemExit('district alias validation failed')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',text,flags=re.S))
          Path('/tmp/index-inline.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v79-district-aliases.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/v79-district-aliases.trigger
          git commit -m 'Fix district aliases blocking rural route preload'
          git push
