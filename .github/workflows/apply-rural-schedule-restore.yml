name: Apply rural schedule restore

on:
  push:
    paths:
      - 'tools/rural-schedule-restore.trigger'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Naesu and Bugi schedules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker="function renderNoNearbyRouteSchedule(type,district){"
          if marker not in s:
              raise SystemExit('renderNoNearbyRouteSchedule marker not found')
          if 'function restoredRuralRiSchedule(type,ctx)' not in s:
              helper=r'''function restoredRuralRiSchedule(type,ctx){
  const district=canonicalDistrict(ctx?.legalEmd||ctx?.district||'');
  if(!RURAL_INFERRED_ROUTE_DISTRICTS.has(district))return null;
  let ri=normalizeRi(ctx?.legalRi||'');
  if(!ri)return null;
  const originalRi=ri;
  let inheritedFrom='';
  // 사용자 지정 규칙: 북이면 광암리는 금암리 수거일정을 그대로 상속합니다.
  if(district==='북이면'&&ri==='광암리'){ri='금암리';inheritedFrom='금암리'}
  const key=`${district}|${ri}`;
  const byDay={};
  for(const day of DAYS){
    const row=(DIRECT_RI_DAYS[type]?.[day]||[]).find(x=>x.key===key);
    if(row?.vehicles?.length)byDay[day]=[...new Set(row.vehicles.map(String))];
  }
  const overrides=CONFIRMED_RI_SCHEDULE_OVERRIDES[type]?.[key]||{};
  for(const [day,vehicles] of Object.entries(overrides)){
    byDay[day]=[...new Set([...(byDay[day]||[]),...(vehicles||[]).map(String)])];
  }
  const days=DAYS.filter(day=>byDay[day]?.length);
  if(!days.length)return null;
  return {district,ri,originalRi,inheritedFrom,key,days,byDay};
}
function renderRestoredRuralRiSchedule(type,ctx){
  const schedule=restoredRuralRiSchedule(type,ctx);
  if(!schedule)return false;
  const vehicles=[...new Set(schedule.days.flatMap(day=>schedule.byDay[day]||[]))];
  selectedVehicle[type]=vehicles.length===1?vehicles[0]:'전체';
  document.getElementById(type+'Badge').textContent=schedule.days.join('·');
  renderDays(type+'Days',schedule.days);
  const rows=schedule.days.map(day=>`<strong>${day}요일:</strong> ${(schedule.byDay[day]||[]).map(v=>escapeHtml(v+'호')).join(' · ')}`).join('<br>');
  const inherited=schedule.inheritedFrom?`<br><span style="color:#6b7280">※ 북이면 ${escapeHtml(schedule.originalRi)}는 기존 지정 규칙에 따라 ${escapeHtml(schedule.inheritedFrom)} 일정을 적용합니다.</span>`:'';
  const apartment=type==='recycle'?'<br><br><strong>공동주택 안내:</strong> 의무관리대상 공동주택은 재활용품 수거에 대해 자체 위탁계약을 체결하여 처리합니다.':'';
  document.getElementById(type+'Detail').innerHTML=`<div class="verified"><strong>${escapeHtml(schedule.district+' '+schedule.originalRi)}</strong><br><strong>2026년 6월 직영 코스표 기준 수거일:</strong><br>${rows}${inherited}<br><span style="color:#6b7280">※ 주소가 표시 수거노선 30m 이내로 매칭되면 해당 노선의 더 세부적인 결과를 우선 적용합니다.</span>${apartment}</div>`;
  return true;
}
'''
              s=s.replace(marker,helper+marker,1)

          old_general="""    }else if(RI_LAYER_DISTRICTS.has(canonicalDistrict(legalEmd||district)) && !inheritedGeneral){
      selectedVehicle.general='전체';
      document.getElementById('generalBadge').textContent='수거노선 확인 중';
      renderDays('generalDays',[]);
      document.getElementById('generalDetail').innerHTML=`<div class=\"pending\"><strong>${escapeHtml([legalEmd||district,legalRi].filter(Boolean).join(' '))}</strong><br>오창은 법정리(리) 단위로 묶어 표시합니다. 내수·북이는 리 단위 구분을 유지하되, 실제 일정은 표시된 수거노선에서 30m 이내인 주소만 확정합니다.</div>`;
"""
          new_general="""    }else if(RI_LAYER_DISTRICTS.has(canonicalDistrict(legalEmd||district)) && !inheritedGeneral){
      selectedVehicle.general='전체';
      if(!renderRestoredRuralRiSchedule('general',ctx)){
        document.getElementById('generalBadge').textContent='수거노선 확인 중';
        renderDays('generalDays',[]);
        document.getElementById('generalDetail').innerHTML=`<div class=\"pending\"><strong>${escapeHtml([legalEmd||district,legalRi].filter(Boolean).join(' '))}</strong><br>오창은 법정리(리) 단위로 묶어 표시합니다. 내수·북이는 제공된 코스표 일정과 주소 인접 수거노선을 함께 확인합니다.</div>`;
      }
"""
          if old_general not in s: raise SystemExit('general rural branch not found')
          s=s.replace(old_general,new_general,1)

          old_recycle="""    }else if(RI_LAYER_DISTRICTS.has(canonicalDistrict(legalEmd||district)) && !inheritedRecycle){
      selectedVehicle.recycle='전체';
      document.getElementById('recycleBadge').textContent='수거노선 확인 중';
      renderDays('recycleDays',[]);
      document.getElementById('recycleDetail').innerHTML=`<div class=\"pending\"><strong>${escapeHtml([legalEmd||district,legalRi].filter(Boolean).join(' '))}</strong><br>오창은 법정리(리) 단위로 묶어 표시합니다. 내수·북이는 리 단위 구분을 유지하되, 실제 일정은 표시된 수거노선에서 30m 이내인 주소만 확정합니다.<br><br><strong>공동주택 안내:</strong> 의무관리대상 공동주택은 재활용품 수거에 대해 자체 위탁계약을 체결하여 처리합니다.</div>`;
"""
          new_recycle="""    }else if(RI_LAYER_DISTRICTS.has(canonicalDistrict(legalEmd||district)) && !inheritedRecycle){
      selectedVehicle.recycle='전체';
      if(!renderRestoredRuralRiSchedule('recycle',ctx)){
        document.getElementById('recycleBadge').textContent='수거노선 확인 중';
        renderDays('recycleDays',[]);
        document.getElementById('recycleDetail').innerHTML=`<div class=\"pending\"><strong>${escapeHtml([legalEmd||district,legalRi].filter(Boolean).join(' '))}</strong><br>오창은 법정리(리) 단위로 묶어 표시합니다. 내수·북이는 제공된 코스표 일정과 주소 인접 수거노선을 함께 확인합니다.<br><br><strong>공동주택 안내:</strong> 의무관리대상 공동주택은 재활용품 수거에 대해 자체 위탁계약을 체결하여 처리합니다.</div>`;
      }
"""
          if old_recycle not in s: raise SystemExit('recycle rural branch not found')
          s=s.replace(old_recycle,new_recycle,1)

          needle="""      if(directGeneral.length){
        renderDirectSchedule('general',directGeneral,directGeneralCtx);
      }else if(districtHasDirectCoverage('general',district)){"""
          repl="""      if(directGeneral.length){
        renderDirectSchedule('general',directGeneral,directGeneralCtx);
      }else if(renderRestoredRuralRiSchedule('general',ctx)){
      }else if(districtHasDirectCoverage('general',district)){"""
          if needle not in s: raise SystemExit('general direct fallback marker not found')
          s=s.replace(needle,repl,1)

          needle="""      if(directRecycle.length){
        renderDirectSchedule('recycle',directRecycle,directRecycleCtx);
      }else if(districtHasDirectCoverage('recycle',district)){"""
          repl="""      if(directRecycle.length){
        renderDirectSchedule('recycle',directRecycle,directRecycleCtx);
      }else if(renderRestoredRuralRiSchedule('recycle',ctx)){
      }else if(districtHasDirectCoverage('recycle',district)){"""
          if needle not in s: raise SystemExit('recycle direct fallback marker not found')
          s=s.replace(needle,repl,1)

          needle="""      if(near?.length)renderNearbyRouteSchedule(type,near,ctx);
      else renderNoNearbyRouteSchedule(type,district);"""
          repl="""      if(near?.length)renderNearbyRouteSchedule(type,near,ctx);
      else if(!renderRestoredRuralRiSchedule(type,ctx))renderNoNearbyRouteSchedule(type,district);"""
          if needle not in s: raise SystemExit('nearby rural fallback marker not found')
          s=s.replace(needle,repl,1)

          s=s.replace('세부 수거요일은 확정자료 확인 후 반영합니다.','제공된 노선표에서 이 주소와 일치하는 세부 코스를 확인하지 못했습니다.')

          required=['function restoredRuralRiSchedule(type,ctx)','function renderRestoredRuralRiSchedule(type,ctx)',"ri==='광암리'","ri='금암리'",'RURAL_ROUTE_MATCH_KM=0.030','v67-rural30-noapart']
          for x in required:
              if x not in s: raise SystemExit('required marker missing: '+x)
          if '세부 수거요일은 확정자료 확인 후 반영합니다.' in s:
              raise SystemExit('stale confirmation text remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          js='\n'.join(x for x in scripts if x.strip() and not x.lstrip().startswith('{'))
          Path('/tmp/index-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit restored schedules
        shell: bash
        run: |
          rm -f tools/rural-schedule-restore.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/rural-schedule-restore.trigger
          git commit -m 'Restore Naesu and Bugi collection schedules'
          git push
