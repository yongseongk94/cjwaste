name: Confirmed versus inferred zone diagnostic

on:
  push:
    paths:
      - 'tools/confirmed-vs-inferred.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect confirmed and inferred zone logic
        run: python3 tools/diag_confirmed_vs_inferred.py
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/confirmed-vs-inferred.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/confirmed_vs_inferred_diag.txt tools/confirmed-vs-inferred.trigger
          git commit -m 'Inspect confirmed versus inferred zone logic'
          git push
