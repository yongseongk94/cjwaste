name: Verify v84 Jangyang zones

on:
  push:
    paths:
      - 'tools/verify-v84-jangyang.trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Jangyang latest-route zones
        run: python3 tools/verify_v84_jangyang.py
      - name: Commit validation report
        run: |
          set -euo pipefail
          rm -f tools/verify-v84-jangyang.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/v84-jangyang-validation.json tools/verify-v84-jangyang.trigger
          git commit -m 'Validate v84 Jangyang latest-route zones'
          git push
