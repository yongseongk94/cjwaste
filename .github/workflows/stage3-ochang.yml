name: Stage 3 Ochang route rebuild
on:
  push:
    paths: ['tools/stage3-ochang.trigger']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 tools/stage3_ochang.py
      - name: Validate JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/a.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',t,flags=re.S)),encoding='utf-8')
          PY
          node --check /tmp/a.js
      - run: |
          rm -f tools/stage3-ochang.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/stage3-ochang.trigger
          git commit -m 'Stage 3: add Ochang route and estimated area'
          git push
