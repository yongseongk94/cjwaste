name: Patch TEST2 rural v9 routes
on:
  push:
    paths:
      - 'tools/test2-rural-v9-patch.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild only remaining rural gaps
        run: python tools/patch_test2_rural_v9.py
      - name: Commit v9 bundle
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/test2-rural-v9-patch.trigger
          git add cjwaste-test2/data/precomputed-rural-routes-no-motorway-v1.json tools/test2-rural-v9-patch-report.json tools/test2-rural-v9-patch.trigger
          git commit -m "Patch TEST2 v9 rural route gaps" || true
          git pull --rebase origin main
          git push
