name: Build test zone district chunks

on:
  push:
    paths:
      - 'tools/test-zone-chunks.trigger'
      - '.github/workflows/build-test-zone-chunks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split v90 zones by district and spatial tile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, math

          root=Path('.')
          out=root/'cjwaste-test'/'data'/'zones'
          out.mkdir(parents=True,exist_ok=True)
          district_slug={'우암동':'uam','내덕1동':'naedeok1','내덕2동':'naedeok2','오근장동':'ogeunjang','율량사천동':'yullyang-sacheon','오창읍':'ochang','내수읍':'naesu','북이면':'bugi'}
          rural={'오창읍','내수읍','북이면'}
          version='zone-v90-dowon-pungjeong-preserve|v76-layer-visibility-refresh'
          manifest={'schemaVersion':1,'zoneVersion':version,'strategy':'district-chunks-for-test-page','types':{'general':[],'recycle':[]}}
          spatial={'schemaVersion':1,'zoneVersion':version,'strategy':'rural-spatial-subchunks-v1','types':{'general':[],'recycle':[]}}

          def points(z):
            rings=z.get('rings') or [z.get('points') or []]
            for ring in rings:
              for p in ring:
                try: yield float(p.get('lat')),float(p.get('lng'))
                except Exception: pass
          def bbox(zones):
            pts=[p for z in zones for p in points(z)]
            if not pts:return None
            return {'minLat':min(p[0] for p in pts),'maxLat':max(p[0] for p in pts),'minLng':min(p[1] for p in pts),'maxLng':max(p[1] for p in pts)}
          def center(z):
            ps=list(points(z))
            if not ps:return (0.0,0.0)
            return (sum(p[0] for p in ps)/len(ps),sum(p[1] for p in ps)/len(ps))

          for type_ in ('general','recycle'):
            src=json.loads((root/f'data/service-zones-v90-{type_}-all.json').read_text(encoding='utf-8'))
            grouped={}
            for z in src.get('zones',[]): grouped.setdefault(z.get('district') or 'unknown',[]).append(z)
            tdir=out/type_; tdir.mkdir(parents=True,exist_ok=True)
            sdir=out/'spatial'/type_; sdir.mkdir(parents=True,exist_ok=True)
            for d,zs in sorted(grouped.items()):
              slug=district_slug.get(d,'unknown')
              path=f'cjwaste-test/data/zones/{type_}/{slug}.json'
              (root/path).write_text(json.dumps({'schemaVersion':1,'zoneVersion':version,'type':type_,'district':d,'zones':zs},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              manifest['types'][type_].append({'district':d,'path':path,'count':len(zs),'bbox':bbox(zs)})
              if d not in rural: continue
              # 4x4 spatial tiles. Each polygon is stored once by centroid; exact geometry is unchanged.
              db=bbox(zs)
              latspan=max(db['maxLat']-db['minLat'],1e-9); lngspan=max(db['maxLng']-db['minLng'],1e-9)
              tiles={}
              for z in zs:
                lat,lng=center(z)
                iy=min(3,max(0,int((lat-db['minLat'])/latspan*4)))
                ix=min(3,max(0,int((lng-db['minLng'])/lngspan*4)))
                tiles.setdefault((iy,ix),[]).append(z)
              for (iy,ix),part in sorted(tiles.items()):
                p=f'cjwaste-test/data/zones/spatial/{type_}/{slug}-{iy}-{ix}.json'
                (root/p).write_text(json.dumps({'schemaVersion':1,'zoneVersion':version,'type':type_,'district':d,'tile':[iy,ix],'zones':part},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
                spatial['types'][type_].append({'district':d,'tile':[iy,ix],'path':p,'count':len(part),'bbox':bbox(part)})

          (root/'cjwaste-test/data/service-zones-test-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'cjwaste-test/data/service-zones-spatial-manifest.json').write_text(json.dumps(spatial,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for t in ('general','recycle'):
            for d in sorted(rural):
              es=[e for e in spatial['types'][t] if e['district']==d]
              print(t,d,'tiles',len(es),'zones',sum(e['count'] for e in es),'max_tile',max((e['count'] for e in es),default=0))
          PY

      - name: Verify spatial split preserves every rural polygon exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          m=json.loads((root/'cjwaste-test/data/service-zones-spatial-manifest.json').read_text())
          for typ in ('general','recycle'):
            src=json.loads((root/f'data/service-zones-v90-{typ}-all.json').read_text())['zones']
            for district in ('오창읍','내수읍','북이면'):
              expected=sum(1 for z in src if z.get('district')==district)
              entries=[e for e in m['types'][typ] if e['district']==district]
              actual=0
              for e in entries:
                obj=json.loads((root/e['path']).read_text())
                assert obj['zoneVersion']==m['zoneVersion']
                assert obj['district']==district
                actual+=len(obj['zones'])
              assert actual==expected,(typ,district,expected,actual)
              assert entries,(typ,district,'no tiles')
          print('spatial split verification OK')
          PY

      - name: Commit test chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cjwaste-test/data
          if git diff --cached --quiet; then echo 'No chunk changes'; exit 0; fi
          git commit -m 'Build spatial service-zone subchunks for test page'
          git push
