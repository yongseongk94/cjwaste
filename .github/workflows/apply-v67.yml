name: Apply v67 rural route update

on:
  push:
    paths:
      - 'tools/apply_v67.ready'

permissions:
  contents: write

jobs:
  apply-v67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v67 transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/apply_v67.py.gz.b64 | gzip -d > /tmp/apply_v67.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply_v67.py')
          s=p.read_text(encoding='utf-8')
          old="""    if n!=1:\n        raise SystemExit(f'v67 transform failed: {label} matches={n}')\n"""
          new="""    if n==0:\n        print('SKIP',label,'(already satisfied/absent)')\n        return\n    if n!=1:\n        raise SystemExit(f'v67 transform failed: {label} matches={n}')\n"""
          if old not in s:
              raise SystemExit('could not patch sub1 zero-match behavior')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile /tmp/apply_v67.py
          python3 /tmp/apply_v67.py index.html
      - name: Validate inline JavaScript and required v67 rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',text,flags=re.S))
          Path('/tmp/index-inline.js').write_text(scripts,encoding='utf-8')
          req=["v67-rural30-noapart","RURAL_ROUTE_MATCH_KM=0.030","const CONTRACT_APARTMENTS=[]","inferredRuralMovementSegments","buildRuralRouteBufferZones","OCHANG_CONTRACT_COLOR","RURAL_INFERRED_ROUTE_DISTRICTS"]
          miss=[x for x in req if x not in text]
          if miss: raise SystemExit('missing v67 markers: '+repr(miss))
          if "const CONTRACT_APARTMENTS=CONTRACT_SOURCE_DATA.apartments" in text: raise SystemExit('stale contractor apartment schedules remain')
          if "new kakao.maps.Circle" in text: raise SystemExit('circle overlay must remain disabled')
          if "housing!=='apartment'" not in text: raise SystemExit('contract apartment route filter missing')
          PY
          node --check /tmp/index-inline.js
      - name: Commit v67
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v67.ready tools/apply_v67.py.gz.b64
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/
          git commit -m 'Apply v67 rural 30m route update'
          git push
