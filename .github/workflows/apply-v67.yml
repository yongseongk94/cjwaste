name: Apply v67 rural route update

on:
  push:
    paths:
      - 'tools/apply_v67.ready'

permissions:
  contents: write

jobs:
  apply-v67:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v67 transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/apply_v67.py.gz.b64 | gzip -d > /tmp/apply_v67.py
          echo '--- helper definitions ---'
          grep -n -E -B2 -A8 'def .*replace|ignore outline in schedule match' /tmp/apply_v67.py | head -120 || true
          echo '--- end helper definitions ---'
          exit 1
      - name: Validate inline JavaScript and required v67 rules
        shell: bash
        run: |
          exit 1
      - name: Commit v67
        shell: bash
        run: |
          exit 1
