name: Analyze index optimization context
on:
  push:
    paths:
      - 'tools/index-opt-context.trigger'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/index_opt_context.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/index-opt-context-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Inspect index cache loading context"
          git push
