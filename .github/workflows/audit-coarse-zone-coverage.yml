name: Audit coarse zone coverage all districts

on:
  push:
    paths:
      - '.github/workflows/audit-coarse-zone-coverage.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current test page
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -fsSL "https://yongseongk94.github.io/cjwaste/cjwaste-test/?coverage_audit=$RANDOM" -o /tmp/test-live.html \
              && grep -q "2023-boundary-v2" /tmp/test-live.html \
              && grep -q "TEST_ZONE_RENDER_MODE='schedule-map-v4-reviewed'" /tmp/test-live.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Audit all general and recycle districts
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          export CHROME_BIN
          cat > audit.js <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN,
              protocolTimeout:1200000,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const page=await browser.newPage();
            page.setDefaultTimeout(1200000);
            page.on('pageerror',e=>console.error('PAGEERROR',e.message));
            await page.goto('https://yongseongk94.github.io/cjwaste/cjwaste-test/?coverage_audit='+Date.now(),{
              waitUntil:'domcontentloaded',timeout:180000
            });
            await page.waitForFunction(()=>typeof map!=='undefined'&&!!map&&typeof ensureTestAdminBoundaryLoad==='function',{timeout:180000});

            const result=await page.evaluate(async()=>{
              document.getElementById('landing').classList.add('hidden');
              map.relayout();
              await ensureTestAdminBoundaryLoad();
              const manifest=await loadServiceZoneManifest();
              const districts=[...new Set([
                ...(manifest?.types?.general||[]).map(e=>canonicalDistrict(e.district)),
                ...(manifest?.types?.recycle||[]).map(e=>canonicalDistrict(e.district))
              ])].filter(Boolean);
              const results={general:{},recycle:{}};

              const sleep=ms=>new Promise(r=>setTimeout(r,ms));
              for(const type of ['general','recycle']){
                activeLayer=type;
                selectedVehicle[type]='전체';
                activeDay='전체';
                serviceLayerState.zone=true;

                for(const district of districts){
                  const feature=districtFeatureMap.get(district);
                  if(!feature){
                    results[type][district]={error:'missing district feature'};
                    continue;
                  }
                  await hydrateExternalBundledServiceZones(type,[district]);
                  const raw=rawServiceZonesForDistrict(type,district);
                  if(!raw.length){
                    results[type][district]={error:'no raw zones'};
                    continue;
                  }
                  const rawCenters=raw.map(z=>{
                    const zb=rawZoneBounds(z);if(!zb)return null;
                    return {lat:(zb.minLat+zb.maxLat)/2,lng:(zb.minLng+zb.maxLng)/2};
                  }).filter(Boolean);
                  const b=featureBounds(feature);
                  const candidates=[
                    {lat:(b.minLat+b.maxLat)/2,lng:(b.minLng+b.maxLng)/2,label:'center'},
                    rawCenters.reduce((a,p)=>!a||p.lat<a.lat?p:a,null),
                    rawCenters.reduce((a,p)=>!a||p.lat>a.lat?p:a,null),
                    rawCenters.reduce((a,p)=>!a||p.lng<a.lng?p:a,null),
                    rawCenters.reduce((a,p)=>!a||p.lng>a.lng?p:a,null)
                  ].filter(Boolean);
                  const samples=[];
                  for(let si=0;si<candidates.length;si++){
                    const p=candidates[si];
                    map.setCenter(new kakao.maps.LatLng(p.lat,p.lng));
                    map.setLevel(4);
                    map.relayout();
                    await sleep(80);

                    const manual=(serviceZoneOverlays[type]||[]).filter(z=>z.manual);
                    for(const z of (serviceZoneOverlays[type]||[]))if(!z.manual)z.polygon?.setMap(null);
                    serviceZoneOverlays[type]=manual;
                    materializeVisibleRawServiceZones(type);
                    await sleep(40);

                    const cover=(serviceZoneOverlays[type]||[]).filter(z=>z.displaySchedule);
                    const view=currentMapBoundsBox(0);
                    let visibleTotal=0,visibleHit=0;
                    const latStep=Math.max((view.maxLat-view.minLat)/22,.00012);
                    const lngStep=Math.max((view.maxLng-view.minLng)/22,.00015);
                    for(let lat=view.minLat+latStep/2;lat<view.maxLat;lat+=latStep){
                      for(let lng=view.minLng+lngStep/2;lng<view.maxLng;lng+=lngStep){
                        if(!pointInGeoFeature([lng,lat],feature))continue;
                        visibleTotal++;
                        if(cover.some(c=>pointInZonePolygon(lat,lng,c)))visibleHit++;
                      }
                    }
                    samples.push({
                      label:p.label||['center','south','north','west','east'][si]||String(si),
                      polygons:cover.length,visibleTotal,visibleHit,
                      visibleRatio:visibleTotal?visibleHit/visibleTotal:1
                    });
                  }

                  // Whole-district ratio is informational only; display is deliberately viewport-driven.
                  const finalCover=(serviceZoneOverlays[type]||[]).filter(z=>z.displayOnly&&z.coarseCover);
                  let total=0,hit=0;
                  for(const q of rawCenters){
                    total++;
                    if(finalCover.some(c=>pointInZonePolygon(q.lat,q.lng,c)))hit++;
                  }
                  results[type][district]={
                    raw:raw.length,
                    maxPolygons:Math.max(...samples.map(s=>s.polygons),0),
                    total,hit,ratio:total?hit/total:1,
                    minVisibleRatio:Math.min(...samples.map(s=>s.visibleRatio)),
                    samples
                  };
                }
              }
              return results;
            });
            console.log('COVERAGE_AUDIT '+JSON.stringify(result));
            let failures=[];
            for(const type of ['general','recycle']){
              for(const [district,r] of Object.entries(result[type]||{})){
                if(r.error)failures.push(type+' '+district+' '+r.error);
                else if((r.minVisibleRatio??0)<0.94)failures.push(type+' '+district+' minVisibleRatio='+r.minVisibleRatio);
              }
            }
            if(failures.length)throw new Error('Coverage failures: '+failures.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node audit.js
