name: Build TEST2 rural no-motorway routes
on:
  push:
    paths:
      - 'tools/test2-rural-no-motorway.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild rural routes without transit motorway lines
        run: python tools/build_test2_rural_no_motorway.py
      - name: Commit rural route bundle
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/test2-rural-no-motorway.trigger
          git add cjwaste-test2/data/precomputed-rural-routes-no-motorway-v1.json tools/test2-rural-no-motorway-report.json tools/test2-rural-no-motorway.trigger
          git commit -m "Build TEST2 rural routes without motorway transit" || true
          git pull --rebase origin main
          git push
