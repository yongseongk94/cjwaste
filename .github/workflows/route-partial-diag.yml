name: Route partial segment diagnostic

on:
  push:
    paths:
      - 'tools/route-partial-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract route caller snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          out=[]
          for a,b in [(2940,3025),(2788,2820),(2470,2570)]:
              out.append(f'===== {a}-{b} =====')
              for n in range(a-1,min(len(s),b)):
                  t=s[n]
                  if len(t)>1800:t=t[:1800]+' ...[CUT]'
                  out.append(f'{n+1}: {t}')
          Path('tools/route_partial_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/route-partial-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/route_partial_diag.txt tools/route-partial-diag.trigger
          git commit -m 'Extend partial route caller snippets'
          git push
