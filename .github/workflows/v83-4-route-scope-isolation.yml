name: Apply v83-4 route scope isolation

on:
  push:
    paths:
      - 'tools/v83-4-route-scope-isolation.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python3 tools/v83_scope_isolation_patch.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',text,flags=re.S))
          Path('/tmp/index-inline.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v83-4-route-scope-isolation.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/v83-4-route-scope-isolation.trigger
          git commit -m 'Isolate dong and rural route scopes'
          git push
