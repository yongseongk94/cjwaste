name: Apply v84 latest route zones

on:
  push:
    paths:
      - 'tools/apply-v84-latest-zone-routes.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v84 patch
        run: python3 tools/apply_v84_latest_zone_routes.py

      - name: Validate JavaScript and capture config
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          Path('/tmp/index-inline.js').write_text(scripts,encoding='utf-8')
          w=Path('.github/workflows/v83-service-zones-refresh.yml').read_text(encoding='utf-8')
          assert 'zone_only=1&v84_zone_refresh=' in w
          assert 'zone-v84-latest-route-evidence|v76-layer-visibility-refresh' in w
          assert "장양2리','장양1리','장양3리" in s
          PY
          node --check /tmp/index-inline.js

      - name: Commit v84 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-v84-latest-zone-routes.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/v83-service-zones-refresh.yml tools/apply-v84-latest-zone-routes.trigger
          git commit -m 'Prepare v84 zones from latest route evidence'
          git push
