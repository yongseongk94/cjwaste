name: Route proxy diagnostic

on:
  push:
    paths:
      - 'tools/route-proxy-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployed route proxy and inspect frontend calls
        shell: bash
        run: |
          set -euo pipefail
          OUT=tools/route_proxy_diag.txt
          : > "$OUT"
          echo '=== live proxy simple POST ===' >> "$OUT"
          curl -sS -D /tmp/h1 -o /tmp/b1 -X POST 'https://cjwaste-route.yseong22.workers.dev/route' \
            -H 'Content-Type: application/json' \
            --data '{"points":[{"x":127.4866,"y":36.6515},{"x":127.4900,"y":36.6540}]}' || true
          cat /tmp/h1 >> "$OUT" || true
          cat /tmp/b1 >> "$OUT" || true
          echo >> "$OUT"
          echo '=== route-generation code ranges ===' >> "$OUT"
          python3 - <<'PY' >> "$OUT"
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          for a,b in [(2420,2585),(2585,2745),(2745,2910)]:
              print(f'--- lines {a}-{b} ---')
              for n in range(a-1,min(len(s),b)):
                  t=s[n]
                  if len(t)>1800:t=t[:1800]+' ...[CUT]'
                  print(f'{n+1}: {t}')
          print('=== all fallback/straight references ===')
          for i,line in enumerate(s):
              if any(k in line for k in ['직선','fallback','fetchRoadFollowingPath(','segments=','segments:', 'routeSource','roadPath']):
                  print(f'{i+1}: {line[:1800]}')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/route-proxy-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/route_proxy_diag.txt tools/route-proxy-diag.trigger
          git commit -m 'Expand route generation diagnostic'
          git push
