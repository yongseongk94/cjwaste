name: Live v70 layer persistence verification

on:
  push:
    paths:
      - 'tools/live-v70-verify.trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for deployed v70
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsSL "https://yongseongk94.github.io/cjwaste/?verify=$RANDOM" -o /tmp/live.html && grep -q 'zone-v70-dong-polygons-persist' /tmp/live.html; then
              echo 'v70 deployed'
              exit 0
            fi
            sleep 4
          done
          echo 'v70 deployment not visible' >&2
          exit 1
      - name: Test live browser zoom scroll and polygons
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME_BIN"
          export CHROME_BIN
          cat > v70-test.js <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:900});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto('https://yongseongk94.github.io/cjwaste/?v70live='+Date.now(),{waitUntil:'domcontentloaded',timeout:180000});
            await page.waitForFunction(()=>typeof map!=='undefined'&&map&&typeof serviceZoneOverlays!=='undefined',{timeout:180000});
            await page.waitForFunction(()=>Array.isArray(serviceZoneOverlays.general)&&serviceZoneOverlays.general.length>0,{timeout:180000});
            await page.evaluate(()=>{serviceLayerState.zone=true;setLayer('general')});
            await new Promise(r=>setTimeout(r,1200));
            const snap=()=>page.evaluate(()=>{
              const zs=serviceZoneOverlays.general||[];
              return {
                activeLayer,
                level:map.getLevel(),
                all:zs.length,
                visible:zs.filter(z=>z.polygon&&z.polygon.getMap()===map).length,
                polygonized:zs.filter(z=>z.polygonized).length,
                visiblePolygonized:zs.filter(z=>z.polygonized&&z.polygon&&z.polygon.getMap()===map).length,
                nonBox:zs.filter(z=>z.polygonized&&Array.isArray(z.rings)&&z.rings[0]&&z.rings[0].length>4).length,
                maxVertices:Math.max(0,...zs.filter(z=>z.polygonized&&Array.isArray(z.rings)&&z.rings[0]).map(z=>z.rings[0].length)),
                holes:zs.filter(z=>z.polygonized&&Array.isArray(z.hitRings)&&z.hitRings.length>1).length,
                zoneEnabled:!!serviceLayerState.zone
              };
            });
            const before=await snap();
            if(before.visible<=0)throw new Error('No visible general service zones before zoom');
            if(before.polygonized<=0||before.nonBox<=0)throw new Error('No non-box polygonized dong zones');

            const box=await page.$eval('#map',el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}});
            await page.mouse.move(box.x+box.width/2,box.y+box.height/2);
            await page.mouse.wheel({deltaY:620});
            await new Promise(r=>setTimeout(r,1800));
            const afterWheel=await snap();
            if(afterWheel.visible<=0)throw new Error('Service zones disappeared after mouse-wheel zoom');

            await page.evaluate(()=>{window.dispatchEvent(new Event('scroll'));});
            await new Promise(r=>setTimeout(r,500));
            const afterPageScroll=await snap();
            if(afterPageScroll.visible<=0)throw new Error('Service zones disappeared after page scroll event');

            await page.evaluate(()=>map.setLevel(Math.min(14,map.getLevel()+1)));
            await new Promise(r=>setTimeout(r,1500));
            const afterSetLevel=await snap();
            if(afterSetLevel.visible<=0)throw new Error('Service zones disappeared after map.setLevel');
            if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));

            const result={before,afterWheel,afterPageScroll,afterSetLevel,pageErrors};
            fs.writeFileSync('tools/v70_live_test.txt',JSON.stringify(result,null,2));
            console.log('LIVE_V70',JSON.stringify(result));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node v70-test.js
      - name: Commit live verification result
        shell: bash
        run: |
          rm -f tools/live-v70-verify.trigger v70-test.js package.json package-lock.json
          git config user.name 'ChatGPT Verification Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/v70_live_test.txt tools/live-v70-verify.trigger
          git commit -m 'Verify v70 polygon layers survive zoom and scroll'
          git push
