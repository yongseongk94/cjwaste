name: Test page JS check

on:
  push:
    paths:
      - 'index.html'
      - 'cjwaste-test/**'
      - '.github/workflows/test-page-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src,dst in [('index.html','/tmp/cjwaste-main-inline.js'),('cjwaste-test/index.html','/tmp/cjwaste-test-inline.js')]:
              s=Path(src).read_text(encoding='utf-8')
              scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
              Path(dst).write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/cjwaste-main-inline.js
          node --check /tmp/cjwaste-test-inline.js
      - name: Check confirmed schedule regression rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('cjwaste-test/index.html').read_text(encoding='utf-8')
          required = {
              '주중동 304-1 주소 보정 ID': "id:'jujung-304-1'",
              '주중동 생활 6224 화요일': "general:{vehicle:'6224',days:['화']}",
              '주중동 재활용 0264 수요일': "recycle:{vehicle:'0264',days:['수']}",
              '행정동 우선 복원': 'function serviceDistrictForContext(ctx)',
              '도원리→풍정리 근거': "'내수읍|도원리':'풍정리'",
              '광암리→금암리 상속': "'북이면|광암리':'금암리'",
              '화하리→내둔리 상속': "'북이면|화하리':'내둔리'",
              '장양리 경유 순서': "'장양리':['장양2리','장양1리','장양3리']",
              '화죽리 정류장 검색 보정': "'화죽리':'화죽리 버스정류장'",
              '화죽리→화상리 근거': "{district:'북이면',ri:'화상리',terms:['화죽리','화죽리버스정류장']}",
              '화죽리→화하리 근거': "{district:'북이면',ri:'화하리',terms:['화죽리','화죽리버스정류장']}",
              '3344 목요일 선택 캐시 갱신': "'general|3344|목'",
              '0262 목요일 선택 캐시 갱신': "'recycle|0262|목'",
              '오창 산단 구간 필터': "function filterOchangIndustrialContractRaw(raw)",
              '오창 산단 허용어': "const OCHANG_CONTRACT_INDUSTRIAL_TERMS=[",
              '오창 구형 대행번들 차단': "routeNeedsPatchedGeometry(spec)||isOchangScienceContractSpec(spec)",
          }
          missing=[name for name,needle in required.items() if needle not in s]
          if missing:
              raise SystemExit('confirmed schedule regression missing: '+', '.join(missing))
          print('confirmed schedule regression rules: OK')
          PY
      - name: Check production service-zone version consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r"const SERVICE_ZONE_CACHE_VERSION=`([^\`]+)\|\$\{DONG_ROUTE_CACHE_VERSION\}`;",html)
          if not m:
              raise SystemExit('production service-zone version constant missing')
          expected=m.group(1)+'|v76-layer-visibility-refresh'
          manifest=json.loads(Path('data/service-zones-production-gapfill-v3-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('zoneVersion')!=expected:
              raise SystemExit(f'manifest version mismatch: {manifest.get("zoneVersion")} != {expected}')
          for type_name in ('general','recycle'):
              for row in manifest['types'][type_name]:
                  data=json.loads(Path(row['path']).read_text(encoding='utf-8'))
                  if data.get('zoneVersion')!=expected:
                      raise SystemExit(f'chunk version mismatch: {row["path"]}: {data.get("zoneVersion")} != {expected}')
          print('production service-zone versions: OK')
          PY
      - name: Check disjoint display geometry and filter stability
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/gh/DevMinGeonPark/mapcn-kr@main/data/emd.json -o /tmp/emd.json
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/gh/DevMinGeonPark/mapcn-kr@main/data/ri/43.json -o /tmp/cjwaste-ri.json
          python3 -m pip install shapely==2.1.2
          node tools/test_reviewed_schedule.cjs
          node tools/test_disjoint_display.cjs /tmp/emd.json /tmp/disjoint-display.json
          python3 tools/validate_disjoint_display.py /tmp/emd.json /tmp/disjoint-display.json
