name: Apply automatic boundary majority

on:
  push:
    paths:
      - 'tools/boundary-majority.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply boundary majority assignment
        run: python3 tools/apply_boundary_majority.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(const KAKAO_KEY=.*)</script>\s*</body>',s,re.S)
          if not m: raise SystemExit('main inline script not found')
          Path('/tmp/cjwaste-main.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/cjwaste-main.js
      - name: Validate boundary-majority markers
        shell: bash
        run: |
          grep -Fq 'zone-v68-boundary-majority' index.html
          grep -Fq 'function dominantNeighborForBoundary' index.html
          grep -Fq 'cell.estimated=true' index.html
          grep -Fq '인접권역 비율이 높은 일정으로 편입 (추정)' index.html
          grep -Fq "zoneStatus:z.estimated?'estimated'" index.html
      - name: Commit update
        shell: bash
        run: |
          rm -f tools/boundary-majority.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/boundary-majority.trigger
          git commit -m 'Assign automatic boundary cells by neighboring route majority'
          git push
