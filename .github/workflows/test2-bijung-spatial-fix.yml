name: Fix TEST2 Bijung spatial route
on:
  push:
    paths:
      - 'tools/test2-bijung-spatial-fix.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Patch Bijung-ri route and bump cache
        run: python tools/fix_test2_bijung_spatial.py
      - name: Commit patched bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/test2-bijung-spatial-fix.trigger
          git add cjwaste-test2/index.html cjwaste-test2/data/precomputed-rural-routes-no-motorway-v1.json tools/test2-bijung-spatial-fix-report.json tools/test2-bijung-spatial-fix.trigger
          git commit -m "Add Bijung-ri road segment to TEST2 rural routes"
          git pull --rebase origin main
          git push
