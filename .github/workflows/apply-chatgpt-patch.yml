name: Apply ChatGPT map update

on:
  push:
    paths:
      - 'tools/chatgpt_patch.diff'
      - 'tools/chatgpt_patch.b64'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare and apply generated patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -s tools/chatgpt_patch.b64 ]; then
            base64 -d tools/chatgpt_patch.b64 | gzip -d > /tmp/chatgpt_patch.diff
          else
            cp tools/chatgpt_patch.diff /tmp/chatgpt_patch.diff
          fi
          git apply --check --whitespace=nowarn /tmp/chatgpt_patch.diff
          git apply --whitespace=nowarn /tmp/chatgpt_patch.diff

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = '\n'.join(re.findall(r'<script>(.*?)</script>', text, flags=re.S))
          Path('/tmp/index-inline.js').write_text(scripts, encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit updated index
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/chatgpt_patch.diff tools/chatgpt_patch.b64
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/chatgpt_patch.diff tools/chatgpt_patch.b64
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply ChatGPT waste-map update'
          git push
