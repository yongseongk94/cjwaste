name: Contractor schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract compact contractor schedule logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          txt=Path('index.html').read_text(encoding='utf-8')
          lines=txt.splitlines()
          out=[f'CURRENT lines={len(lines)} chars={len(txt)}']
          keys=['CONTRACT_ROUTES','CONTRACT_ROUTE_META','CONTRACT_SOURCE_DATA','contractExactScheduleMatch','renderContractExactSchedule','findRegionEntries','요일 확인 필요','제일환경','현대환경','대행수거']
          hits=[]
          for i,line in enumerate(lines):
              if any(k in line for k in keys): hits.append(i)
          selected=set()
          for i in hits:
              for n in range(max(0,i-5),min(len(lines),i+10)): selected.add(n)
          for n in sorted(selected):
              line=lines[n]
              if len(line)>1800: line=line[:1800]+' ...[TRUNCATED]'
              out.append(f'{n+1}: {line}')
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Record compact contractor schedule diagnostic'
          git push
