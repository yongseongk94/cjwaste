name: Contractor schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect automatic zone boundary logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          txt=Path('index.html').read_text(encoding='utf-8')
          lines=txt.splitlines()
          pats=[r'zone',r'Zone',r'polygon',r'Polygon',r'boundary',r'Boundary',r'권역',r'pointIn',r'contains',r'nearestRoute',r'renderNearbyRouteSchedule',r'auto']
          hits=[]
          for i,line in enumerate(lines):
              if any(re.search(p,line) for p in pats):
                  hits.append(i)
          ranges=[]
          for i in hits:
              a=max(0,i-5); b=min(len(lines),i+8)
              if ranges and a<=ranges[-1][1]+2:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          out=[f'lines={len(lines)} ranges={len(ranges)}']
          for a,b in ranges:
              out.append(f'\n===== {a+1}-{b} =====')
              out.extend(f'{n+1}: {lines[n]}' for n in range(a,b))
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Inspect automatic zone boundary logic'
          git push
