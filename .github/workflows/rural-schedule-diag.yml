name: Rural schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract rural schedule logic
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,re
          from pathlib import Path
          refs=[('CURRENT','HEAD'),('V59','634016e4d7d1c35d902c374e51b5d0265236e25b'),('V58','bc51e6316c536a39494e39ba4c2c61d4ed047ab3'),('PRE_V58','bc51e6316c536a39494e39ba4c2c61d4ed047ab3^')]
          pats=[
            'const DIRECT_ROUTES=', 'const UNCONFIRMED_RIS=', 'const RI_LAYER_DISTRICTS=',
            'function inheritedScheduleContext', 'function findDirectMatches', 'function renderSchedule',
            'function refreshNearbyRouteSchedules', 'function serviceRouteGroups',
            '세부 수거요일은 확정자료 확인 후 반영합니다', '수거정보 미확인',
            "district==='북이면'", "district==='내수읍'", '광암리', '초정리'
          ]
          out=[]
          for label,ref in refs:
            try:
              txt=subprocess.check_output(['git','show',f'{ref}:index.html'],text=True,encoding='utf-8',errors='replace')
            except Exception as e:
              out += [f'===== {label} ERROR {e} =====','']
              continue
            lines=txt.splitlines()
            out.append(f'===== {label} {ref} lines={len(lines)} chars={len(txt)} =====')
            hits=[]
            for i,line in enumerate(lines):
              if any(p in line for p in pats): hits.append(i)
            ranges=[]
            for i in hits:
              a=max(0,i-12); b=min(len(lines),i+35)
              if ranges and a<=ranges[-1][1]+3: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else: ranges.append((a,b))
            for a,b in ranges:
              out.append(f'--- lines {a+1}-{b} ---')
              for n in range(a,b): out.append(f'{n+1}: {lines[n]}')
            out.append('')
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Record rural schedule diagnostic'
          git push
