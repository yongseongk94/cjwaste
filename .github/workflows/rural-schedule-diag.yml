name: Rural schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract current rural schedule logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          txt=Path('index.html').read_text(encoding='utf-8')
          lines=txt.splitlines()
          out=[f'CURRENT lines={len(lines)} chars={len(txt)}']
          for a,b,title in [(1200,1325,'renderSchedule'),(1460,1760,'match/render helpers'),(1925,2025,'refreshNearbyRouteSchedules')]:
              out.append(f'\n===== {title} lines {a}-{b} =====')
              for n in range(a-1,min(b,len(lines))): out.append(f'{n+1}: {lines[n]}')
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Record current rural schedule logic'
          git push
