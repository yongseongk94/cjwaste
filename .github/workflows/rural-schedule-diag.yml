name: Contractor schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize contractor schedules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          txt=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const CONTRACT_SOURCE_DATA=(\{.*?\});\nconst CONTRACT_ROUTES=',txt,re.S)
          if not m: raise SystemExit('CONTRACT_SOURCE_DATA not found')
          data=json.loads(m.group(1))
          out=[]
          for typ in ('general','recycle'):
              out.append(f'[{typ}]')
              for r in data.get('routes',{}).get(typ,[]):
                  if r.get('housing')=='apartment': continue
                  out.append(f"{r.get('provider')} | {r.get('plate')} | {','.join(r.get('districts',[]))} | {r.get('housing')} | zoneEligible={r.get('zoneEligible')} | days={','.join(r.get('days',{}).keys())}")
          out.append('[special]')
          for r in data.get('special',[]):
              if r.get('housing')=='apartment': continue
              out.append(f"{r.get('type')} | {r.get('provider')} | {r.get('district')} | {r.get('vehicle')} | {r.get('address')} | days={','.join(r.get('days',[]))}")
          out.append('[meta]')
          for k,v in data.get('meta',{}).items():
              if v.get('housing')=='apartment': continue
              out.append(f"{k} => provider={v.get('provider')} plate={v.get('plate')} district={v.get('district')} housing={v.get('housing')} zoneEligible={v.get('zoneEligible')}")
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Summarize contractor schedules'
          git push
