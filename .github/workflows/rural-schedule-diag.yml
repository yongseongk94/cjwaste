name: Contractor schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect automatic zone boundary logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          pats=[r'zone',r'Zone',r'polygon',r'Polygon',r'boundary',r'Boundary',r'권역',r'pointIn',r'contains',r'nearestRoute',r'renderNearbyRouteSchedule',r'auto']
          hit=[]
          for i,line in enumerate(lines):
              if i < 500 or len(line)>1200: continue
              if any(re.search(p,line) for p in pats): hit.append(i)
          out=[f'lines={len(lines)} hits={len(hit)}']
          used=set()
          for i in hit:
              a=max(500,i-3); b=min(len(lines),i+5)
              for n in range(a,b):
                  if n in used or len(lines[n])>1200: continue
                  used.add(n); out.append(f'{n+1}: {lines[n][:1000]}')
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Narrow automatic zone diagnostic output'
          git push
