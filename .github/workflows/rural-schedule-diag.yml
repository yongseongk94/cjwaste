name: Contractor schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect service zone match and rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          needles=['function ensureServiceZoneMatch','function renderServiceZoneSchedule','ensureServiceZoneMatch=','renderServiceZoneSchedule=']
          out=[f'lines={len(lines)}']
          for needle in needles:
              for i,s in enumerate(lines):
                  if needle in s:
                      a=max(0,i-15); b=min(len(lines),i+85)
                      out.append(f'===== {needle} @ {i+1} =====')
                      for n in range(a,b):
                          t=lines[n]
                          if len(t)>1400:t=t[:1400]+' ...[CUT]'
                          out.append(f'{n+1}: {t}')
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Inspect service zone match and rendering'
          git push
