name: Contractor schedule diagnostic

on:
  push:
    paths:
      - 'tools/rural-schedule-diag.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract contractor schedule logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          txt=Path('index.html').read_text(encoding='utf-8')
          lines=txt.splitlines()
          pats=['CONTRACT_ROUTES','CONTRACT_ROUTE_META','CONTRACT_SOURCE_DATA','findRegionEntries','contractExactScheduleMatch','renderContractExactSchedule','요일 확인 필요','제일환경','현대환경','덕성환경','청원환경','대행수거']
          hits=[]
          for i,line in enumerate(lines):
              if any(p in line for p in pats): hits.append(i)
          ranges=[]
          for i in hits:
              a=max(0,i-18); b=min(len(lines),i+55)
              if ranges and a<=ranges[-1][1]+3:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          out=[f'CURRENT lines={len(lines)} chars={len(txt)}']
          for a,b in ranges:
              out.append(f'\n===== lines {a+1}-{b} =====')
              for n in range(a,b): out.append(f'{n+1}: {lines[n]}')
          Path('tools/rural_schedule_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          rm -f tools/rural-schedule-diag.trigger
          git config user.name 'ChatGPT Diagnostic Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rural_schedule_diag.txt tools/rural-schedule-diag.trigger
          git commit -m 'Record contractor schedule diagnostic'
          git push
