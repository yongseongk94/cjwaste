name: Optimize index payload
on:
  push:
    paths:
      - 'tools/index-optimize-stage1.trigger'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Externalize heavy payloads and make bundle cache-first
        run: python3 tools/index_optimize_stage1.py
      - name: Validate generated JSON and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="bundledPrecomputed" type="application/json" data-src="([^"]+)"></script>',s)
          assert m, 'bundle marker missing'
          data=json.loads(Path(m.group(1)).read_text(encoding='utf-8'))
          assert data.get('routes'), 'routes missing'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          main=max(scripts,key=len)
          Path('/tmp/cjwaste-main.js').write_text(main,encoding='utf-8')
          assert Path('assets/landing-bg.jpg').stat().st_size>100000
          assert Path('index.html').stat().st_size<1200000, Path('index.html').stat().st_size
          print('STATIC_VALIDATION_OK',Path('index.html').stat().st_size,len(data.get('routes') or []))
          PY
          node --check /tmp/cjwaste-main.js
      - name: Commit optimized payload layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/landing-bg.jpg data tools/index-optimize-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "Optimize index payload for route data growth"
          git push
