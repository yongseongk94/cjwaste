name: Merge automatic service-zone blocks

on:
  push:
    paths:
      - 'tools/zone-merge.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge automatic grid zones
        run: python3 tools/merge_zone_blocks.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(const KAKAO_KEY=.*)</script>\s*</body>',s,re.S)
          if not m: raise SystemExit('main inline script not found')
          Path('/tmp/cjwaste-main.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/cjwaste-main.js
      - name: Validate merge markers
        shell: bash
        run: |
          grep -Fq 'zone-v69-merged-grid-blocks' index.html
          grep -Fq 'const finished=[];let active=new Map();' index.html
          grep -Fq 'gridMerged:true' index.html
          grep -Fq "meta.gridMerged?0:" index.html
          grep -Fq "cell.estimated=true" index.html
      - name: Commit update
        shell: bash
        run: |
          rm -f tools/zone-merge.trigger
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/zone-merge.trigger
          git commit -m 'Merge adjacent automatic service-zone cells'
          git push
