name: Test v74 parser runtime

on:
  push:
    paths:
      - 'tools/v74-runtime-test.trigger'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Runtime parser inspection
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          export CHROME_BIN
          node - <<'NODE' > tools/v74_runtime_test.txt
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage','--disable-cache']});
            const page=await browser.newPage();
            await page.setCacheEnabled(false);
            await page.goto('https://yongseongk94.github.io/cjwaste/?runtime='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>typeof routeDescriptorsForMap==='function',{timeout:120000});
            const r=await page.evaluate(()=>{
              const a='사북로 145~121';
              const b='교서로 222번길 일대 (쉐보레부품,더좋은하우스)';
              return {
                version: typeof DONG_ROUTE_CACHE_VERSION==='undefined'?null:DONG_ROUTE_CACHE_VERSION,
                expandA: expandRouteShorthand(a),
                knownA: expandKnownMultiLocationSource(a),
                topA: splitTopLevelRouteParts(a),
                rangeA: splitRouteRangeUnit(a),
                unitsA: splitRouteLocationUnits(a),
                finalA: routeDescriptorsForMap(a),
                expandB: expandRouteShorthand(b),
                knownB: expandKnownMultiLocationSource(b),
                topB: splitTopLevelRouteParts(b),
                unitsB: splitRouteLocationUnits(b),
                finalB: routeDescriptorsForMap(b),
                routeFn: routeDescriptorsForMap.toString(),
                rangeFn: splitRouteRangeUnit.toString(),
                topFn: splitTopLevelRouteParts.toString()
              };
            });
            console.log(JSON.stringify(r,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit runtime report
        run: |
          git config user.name 'ChatGPT Update Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/v74-runtime-test.trigger
          git add tools/v74_runtime_test.txt tools/v74-runtime-test.trigger
          git commit -m 'Record v74 runtime parser behavior'
          git push
